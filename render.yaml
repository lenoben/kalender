services:
  - type: web
    name: go-supabase-calendar
    env: docker
    plan: free
    region: oregon
    dockerfilePath: ./Dockerfile
    envVars:
      - key: PORT
        value: 8080
      - key: ENV
        value: production
      - key: DATABASE_URL
        sync: false # Set in Render Dashboard with your Supabase Connection String
      - key: ADMIN_PASSWORD
        sync: false # Set in Render Dashboard
      - key: SESSION_SECRET
        generateValue: true
