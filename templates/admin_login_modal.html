{{ define "admin_login_modal" }}
<dialog id="login-dialog" class="dialog dialog-sm" aria-labelledby="login-dialog-title">
  <div class="dialog-head">
    <div>
      <h2 id="login-dialog-title" class="dialog-title">Admin sign in</h2>
      <p class="dialog-sub">Authenticate to manage schedule entries.</p>
    </div>
    <button type="button" class="btn btn-ghost btn-icon" data-close aria-label="Close">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M18 6L6 18M6 6l12 12"/></svg>
    </button>
  </div>

  <div class="dialog-body">
    <form id="login-form" class="form">
      <div class="field">
        <label for="admin-password">Password</label>
        <div class="input-wrap">
          <input class="input" type="password" id="admin-password" name="password" required autocomplete="current-password">
          <button type="button" id="toggle-password" class="btn btn-ghost btn-sm btn-icon" aria-label="Show password" aria-pressed="false">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg>
          </button>
        </div>
      </div>
      <button type="submit" class="btn btn-primary btn-block">Sign in</button>
    </form>
  </div>
</dialog>
{{ end }}
