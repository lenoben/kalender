{{ define "task_modal" }}
<dialog id="day-dialog" class="dialog" aria-labelledby="day-dialog-title">
  <div class="dialog-head">
    <div>
      <h2 id="day-dialog-title" class="dialog-title">Schedule</h2>
      <p id="day-dialog-sub" class="dialog-sub">Loading…</p>
    </div>
    <button type="button" class="btn btn-ghost btn-icon" data-close aria-label="Close">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M18 6L6 18M6 6l12 12"/></svg>
    </button>
  </div>

  <div class="dialog-body">
    <section class="section">
      <div id="day-loading" class="task-list" aria-hidden="true">
        <div class="skeleton"></div>
        <div class="skeleton"></div>
      </div>
      <div id="day-empty" class="empty" hidden>
        <span class="empty-icon">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 3"/></svg>
        </span>
        No entries scheduled for this day.
      </div>
      <div id="day-tasks" class="task-list"></div>
    </section>

    {{ if .IsAdmin }}
    <section class="section">
      <h3 class="section-title">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>
        Add entry
      </h3>
      <p class="section-sub">Create a time block for this day.</p>

      <form id="create-task-form" class="form">
        <div class="form-row">
          <div class="field">
            <label for="task-start">Start</label>
            <input class="input" type="time" id="task-start" name="start_time" required value="09:00">
          </div>
          <div class="field">
            <label for="task-end">End</label>
            <input class="input" type="time" id="task-end" name="end_time" required value="10:00">
          </div>
        </div>
        <div class="field">
          <label for="task-title">Title</label>
          <input class="input" type="text" id="task-title" name="title" required maxlength="255" placeholder="e.g. Client discovery call">
        </div>
        <div class="field">
          <label for="task-description">Notes <span class="optional">(optional)</span></label>
          <textarea class="input" id="task-description" name="description" rows="2" maxlength="2000" placeholder="Location, agenda or video link"></textarea>
        </div>
        <div class="form-actions">
          <label class="checkbox">
            <input type="checkbox" id="task-booked" name="is_booked">
            Mark as booked
          </label>
          <button type="submit" class="btn btn-primary">Add entry</button>
        </div>
      </form>
    </section>
    {{ else }}
    <section class="section">
      <h3 class="section-title">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M22 2L11 13M22 2l-7 20-4-9-9-4 20-7z"/></svg>
        Request a time slot
      </h3>
      <p class="section-sub">Send a request for this day. You'll be contacted by email.</p>

      <form id="request-form" class="form">
        <div class="form-row stack-sm">
          <div class="field">
            <label for="req-name">Name</label>
            <input class="input" type="text" id="req-name" name="requested_by_name" required maxlength="255" autocomplete="name" placeholder="Jane Doe">
          </div>
          <div class="field">
            <label for="req-email">Email</label>
            <input class="input" type="email" id="req-email" name="requested_by_email" required maxlength="255" autocomplete="email" inputmode="email" placeholder="jane@example.com">
          </div>
        </div>
        <div class="form-row">
          <div class="field">
            <label for="req-start">Start</label>
            <input class="input" type="time" id="req-start" name="start_time" required value="10:00">
          </div>
          <div class="field">
            <label for="req-end">End</label>
            <input class="input" type="time" id="req-end" name="end_time" required value="11:00">
          </div>
        </div>
        <div class="field">
          <label for="req-title">Subject</label>
          <input class="input" type="text" id="req-title" name="title" required maxlength="255" placeholder="e.g. Partnership discussion">
        </div>
        <div class="field">
          <label for="req-description">Message <span class="optional">(optional)</span></label>
          <textarea class="input" id="req-description" name="description" rows="3" maxlength="2000" placeholder="What would you like to discuss?"></textarea>
        </div>
        <div class="form-actions end">
          <button type="submit" class="btn btn-primary">Send request</button>
        </div>
      </form>
    </section>
    {{ end }}
  </div>
</dialog>
{{ end }}
