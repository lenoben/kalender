{{ define "task_modal" }}
<!-- Day Task Details & Booking Request Dialog Modal -->
<div id="task-modal" class="fixed inset-0 z-40 hidden items-center justify-center p-4 bg-slate-900/40 dark:bg-slate-950/80 backdrop-blur-sm transition-opacity duration-300">
  <div class="bg-white dark:bg-dark-800 text-slate-900 dark:text-white max-w-2xl w-full rounded-2xl shadow-2xl overflow-hidden flex flex-col max-h-[90vh] border border-slate-200 dark:border-slate-700/80 animate-in fade-in zoom-in-95 duration-200">
    
    <!-- Dialog Header -->
    <div class="flex items-center justify-between px-6 py-4 border-b border-slate-200 dark:border-slate-800 bg-slate-50 dark:bg-slate-900/60">
      <div>
        <div class="flex items-center gap-2">
          <svg class="w-5 h-5 text-indigo-600 dark:text-indigo-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z"/>
          </svg>
          <h3 id="modal-date-title" class="font-display font-bold text-lg text-slate-900 dark:text-white">Daily Schedule</h3>
        </div>
        <p id="modal-date-subtitle" class="text-xs text-slate-500 dark:text-slate-400 mt-0.5">Time-allocated tasks & availability status</p>
      </div>

      <button onclick="closeTaskModal()" class="p-1.5 text-slate-400 hover:text-slate-700 dark:hover:text-white bg-slate-100 dark:bg-slate-800 hover:bg-slate-200 dark:hover:bg-slate-700 rounded-lg transition-colors">
        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/>
        </svg>
      </button>
    </div>

    <!-- Dialog Content Scroll Area -->
    <div class="flex-1 overflow-y-auto p-6 space-y-6">
      
      <!-- Loading Skeleton -->
      <div id="modal-loading" class="space-y-3 py-6">
        <div class="h-16 bg-slate-100 dark:bg-slate-800/50 rounded-xl animate-pulse"></div>
        <div class="h-16 bg-slate-100 dark:bg-slate-800/50 rounded-xl animate-pulse"></div>
      </div>

      <!-- Empty State -->
      <div id="modal-empty-state" class="hidden text-center py-6 space-y-2">
        <div class="w-10 h-10 rounded-full bg-slate-100 dark:bg-slate-800 flex items-center justify-center mx-auto text-slate-400">
          <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z"/>
          </svg>
        </div>
        <p class="text-xs font-medium text-slate-600 dark:text-slate-300">No scheduled tasks yet for this date.</p>
      </div>

      <!-- Task List Container -->
      <div id="modal-task-list" class="space-y-3"></div>

      <!-- Visitor Booking Request Form -->
      <div class="border-t border-slate-200 dark:border-slate-800 pt-6 mt-6">
        
        <div id="public-booking-section">
          <div class="flex items-center justify-between mb-4">
            <div>
              <h4 class="font-display font-semibold text-sm text-indigo-600 dark:text-indigo-300 flex items-center gap-2">
                <svg class="w-4 h-4 text-indigo-500" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z"/>
                </svg>
                Request a Time Slot
              </h4>
              <p class="text-[11px] text-slate-500 dark:text-slate-400 mt-0.5">Submit a request to book time on this day.</p>
            </div>
          </div>

          <form id="public-request-form" onsubmit="handlePublicBookingRequest(event)" class="space-y-3.5 bg-slate-50 dark:bg-slate-900/70 p-4 rounded-xl border border-slate-200 dark:border-slate-800">
            <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
              <div>
                <label class="block text-xs font-medium text-slate-700 dark:text-slate-300 mb-1">Your Full Name</label>
                <input type="text" id="req-name" required placeholder="e.g. John Doe" class="w-full bg-white dark:bg-slate-950 border border-slate-300 dark:border-slate-700 rounded-lg px-3 py-1.5 text-xs text-slate-900 dark:text-white placeholder-slate-400 focus:ring-2 focus:ring-indigo-500 focus:outline-none">
              </div>
              <div>
                <label class="block text-xs font-medium text-slate-700 dark:text-slate-300 mb-1">Your Email</label>
                <input type="email" id="req-email" required placeholder="john@example.com" class="w-full bg-white dark:bg-slate-950 border border-slate-300 dark:border-slate-700 rounded-lg px-3 py-1.5 text-xs text-slate-900 dark:text-white placeholder-slate-400 focus:ring-2 focus:ring-indigo-500 focus:outline-none">
              </div>
            </div>

            <div class="grid grid-cols-2 gap-3">
              <div>
                <label class="block text-xs font-medium text-slate-700 dark:text-slate-300 mb-1">Requested Start</label>
                <input type="time" id="req-start-time" required value="10:00" class="w-full bg-white dark:bg-slate-950 border border-slate-300 dark:border-slate-700 rounded-lg px-3 py-1.5 text-xs text-slate-900 dark:text-white focus:ring-2 focus:ring-indigo-500 focus:outline-none">
              </div>
              <div>
                <label class="block text-xs font-medium text-slate-700 dark:text-slate-300 mb-1">Requested End</label>
                <input type="time" id="req-end-time" required value="11:00" class="w-full bg-white dark:bg-slate-950 border border-slate-300 dark:border-slate-700 rounded-lg px-3 py-1.5 text-xs text-slate-900 dark:text-white focus:ring-2 focus:ring-indigo-500 focus:outline-none">
              </div>
            </div>

            <div>
              <label class="block text-xs font-medium text-slate-700 dark:text-slate-300 mb-1">Subject / Meeting Title</label>
              <input type="text" id="req-title" required placeholder="e.g. Partnership Discussion" class="w-full bg-white dark:bg-slate-950 border border-slate-300 dark:border-slate-700 rounded-lg px-3 py-1.5 text-xs text-slate-900 dark:text-white placeholder-slate-400 focus:ring-2 focus:ring-indigo-500 focus:outline-none">
            </div>

            <div>
              <label class="block text-xs font-medium text-slate-700 dark:text-slate-300 mb-1">Message / Meeting Details</label>
              <textarea id="req-description" rows="2" placeholder="Briefly describe what you'd like to discuss..." class="w-full bg-white dark:bg-slate-950 border border-slate-300 dark:border-slate-700 rounded-lg px-3 py-1.5 text-xs text-slate-900 dark:text-white placeholder-slate-400 focus:ring-2 focus:ring-indigo-500 focus:outline-none resize-none"></textarea>
            </div>

            <div class="flex justify-end pt-1">
              <button type="submit" class="px-4 py-2 bg-gradient-to-r from-indigo-600 to-teal-600 hover:from-indigo-500 hover:to-teal-500 text-white font-semibold text-xs rounded-lg shadow-md shadow-indigo-600/20 transition-all flex items-center gap-1.5">
                <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 19l9 2-9-18-9 18 9-2zm0 0v-8"/>
                </svg>
                Send Time Request
              </button>
            </div>
          </form>
        </div>

        <!-- Admin Add Task Form (shown if authenticated) -->
        <div id="admin-add-task-section" class="hidden mt-6 pt-6 border-t border-slate-200 dark:border-slate-800">
          <div class="flex items-center justify-between mb-4">
            <h4 class="font-display font-semibold text-sm text-emerald-600 dark:text-emerald-400 flex items-center gap-2">
              <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 6v6m0 0v6m0-6h6m-6 0H6"/>
              </svg>
              Admin: Add Schedule Entry
            </h4>
          </div>

          <form id="create-task-form" onsubmit="handleCreateTask(event)" class="space-y-4 bg-slate-50 dark:bg-slate-900/70 p-4 rounded-xl border border-slate-200 dark:border-slate-800">
            <div class="grid grid-cols-2 gap-3">
              <div>
                <label class="block text-xs font-medium text-slate-700 dark:text-slate-300 mb-1">Start Time</label>
                <input type="time" id="task-start-time" required value="09:00" class="w-full bg-white dark:bg-slate-950 border border-slate-300 dark:border-slate-700 rounded-lg px-3 py-1.5 text-xs text-slate-900 dark:text-white focus:ring-2 focus:ring-indigo-500 focus:outline-none">
              </div>
              <div>
                <label class="block text-xs font-medium text-slate-700 dark:text-slate-300 mb-1">End Time</label>
                <input type="time" id="task-end-time" required value="10:00" class="w-full bg-white dark:bg-slate-950 border border-slate-300 dark:border-slate-700 rounded-lg px-3 py-1.5 text-xs text-slate-900 dark:text-white focus:ring-2 focus:ring-indigo-500 focus:outline-none">
              </div>
            </div>

            <div>
              <label class="block text-xs font-medium text-slate-700 dark:text-slate-300 mb-1">Task Title</label>
              <input type="text" id="task-title" required placeholder="e.g. Client Discovery Call" class="w-full bg-white dark:bg-slate-950 border border-slate-300 dark:border-slate-700 rounded-lg px-3 py-1.5 text-xs text-slate-900 dark:text-white placeholder-slate-400 focus:ring-2 focus:ring-indigo-500 focus:outline-none">
            </div>

            <div>
              <label class="block text-xs font-medium text-slate-700 dark:text-slate-300 mb-1">Notes / Description (Optional)</label>
              <textarea id="task-description" rows="2" placeholder="Add specific notes, location, or video link..." class="w-full bg-white dark:bg-slate-950 border border-slate-300 dark:border-slate-700 rounded-lg px-3 py-1.5 text-xs text-slate-900 dark:text-white placeholder-slate-400 focus:ring-2 focus:ring-indigo-500 focus:outline-none resize-none"></textarea>
            </div>

            <div class="flex items-center justify-between pt-1">
              <label class="flex items-center gap-2 cursor-pointer">
                <input type="checkbox" id="task-is-booked" class="rounded bg-white dark:bg-slate-950 border-slate-300 dark:border-slate-700 text-indigo-600 focus:ring-indigo-500 w-4 h-4">
                <span class="text-xs text-slate-700 dark:text-slate-300">Mark as Fully Booked</span>
              </label>

              <button type="submit" class="px-4 py-2 bg-gradient-to-r from-emerald-600 to-teal-600 hover:from-emerald-500 hover:to-teal-500 text-white font-semibold text-xs rounded-lg shadow-md shadow-emerald-600/20 transition-all flex items-center gap-1.5">
                <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"/>
                </svg>
                Create Allocation
              </button>
            </div>
          </form>
        </div>

      </div>

    </div>
  </div>
</div>

<script>
  async function openTaskModal(dateStr) {
    currentSelectedDate = dateStr;
    const modal = document.getElementById('task-modal');
    const titleEl = document.getElementById('modal-date-title');
    const loadingEl = document.getElementById('modal-loading');
    const listEl = document.getElementById('modal-task-list');
    const emptyEl = document.getElementById('modal-empty-state');
    const adminSection = document.getElementById('admin-add-task-section');
    
    const dateObj = new Date(dateStr + 'T00:00:00');
    const formattedDate = dateObj.toLocaleDateString('en-US', { weekday: 'long', month: 'short', day: 'numeric', year: 'numeric' });
    titleEl.textContent = formattedDate;

    modal.classList.remove('hidden');
    modal.classList.add('flex');
    loadingEl.classList.remove('hidden');
    listEl.innerHTML = '';
    emptyEl.classList.add('hidden');

    try {
      const res = await fetch(`/api/tasks?date=${dateStr}`);
      const responseData = await res.json();
      
      loadingEl.classList.add('hidden');

      if (res.ok && responseData.success) {
        const payload = responseData.data;
        const tasks = payload.tasks || [];
        isAdminAuthenticated = payload.is_admin;

        if (isAdminAuthenticated) {
          adminSection.classList.remove('hidden');
        } else {
          adminSection.classList.add('hidden');
        }

        if (tasks.length === 0) {
          emptyEl.classList.remove('hidden');
        } else {
          renderTaskList(tasks);
        }
      } else {
        showToast('Failed to fetch tasks', 'error');
      }
    } catch (err) {
      loadingEl.classList.add('hidden');
      showToast('Network error fetching daily schedule', 'error');
    }
  }

  function closeTaskModal() {
    const modal = document.getElementById('task-modal');
    modal.classList.add('hidden');
    modal.classList.remove('flex');
  }

  function renderTaskList(tasks) {
    const listEl = document.getElementById('modal-task-list');
    listEl.innerHTML = '';

    tasks.forEach(t => {
      const taskCard = document.createElement('div');
      const isBooked = t.is_booked;

      taskCard.className = `p-4 rounded-xl border transition-all flex flex-col sm:flex-row sm:items-center justify-between gap-3 ${
        isBooked 
          ? 'bg-rose-50 border-rose-200 dark:bg-rose-950/20 dark:border-rose-500/30' 
          : 'bg-emerald-50 border-emerald-200 dark:bg-emerald-950/20 dark:border-emerald-500/30'
      }`;

      taskCard.innerHTML = `
        <div class="space-y-1">
          <div class="flex items-center gap-2 flex-wrap">
            <span class="px-2 py-0.5 rounded text-xs font-mono font-bold ${
              isBooked ? 'bg-rose-100 text-rose-800 dark:bg-rose-900/60 dark:text-rose-300' : 'bg-emerald-100 text-emerald-800 dark:bg-emerald-900/60 dark:text-emerald-300'
            }">
              ${t.start_time} - ${t.end_time}
            </span>
            <span class="px-2 py-0.5 rounded text-[10px] font-semibold uppercase ${
              isBooked ? 'bg-rose-100 text-rose-700 border border-rose-300 dark:bg-rose-500/20 dark:text-rose-400 dark:border-rose-500/30' : 'bg-emerald-100 text-emerald-700 border border-emerald-300 dark:bg-emerald-500/20 dark:text-emerald-400 dark:border-emerald-500/30'
            }">
              ${isBooked ? 'Fully Booked' : 'Open / Available'}
            </span>
          </div>
          <h5 class="font-bold text-sm text-slate-900 dark:text-white">${t.title}</h5>
          ${t.description ? `<p class="text-xs text-slate-600 dark:text-slate-400">${t.description}</p>` : ''}
          ${t.requested_by_name ? `
            <p class="text-[11px] text-indigo-700 dark:text-indigo-300 font-semibold">Requested by: ${t.requested_by_name} (${t.requested_by_email})</p>
          ` : ''}
        </div>

        ${isAdminAuthenticated ? `
          <div class="flex items-center gap-2 self-end sm:self-center pt-2 sm:pt-0">
            <button onclick="toggleTaskBooking('${t.id}')" class="px-2.5 py-1 text-xs font-medium text-slate-700 dark:text-slate-300 hover:text-slate-900 dark:hover:text-white bg-slate-200 dark:bg-slate-800 hover:bg-slate-300 dark:hover:bg-slate-700 border border-slate-300 dark:border-slate-700 rounded-lg transition-colors">
              ${isBooked ? 'Set Available' : 'Set Booked'}
            </button>
            <button onclick="deleteTask('${t.id}')" class="p-1.5 text-rose-600 dark:text-rose-400 hover:text-rose-800 dark:hover:text-rose-200 bg-rose-100 dark:bg-rose-950/50 hover:bg-rose-200 dark:hover:bg-rose-900/80 border border-rose-300 dark:border-rose-800/50 rounded-lg transition-colors">
              <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"/>
              </svg>
            </button>
          </div>
        ` : ''}
      `;

      listEl.appendChild(taskCard);
    });
  }

  async function handlePublicBookingRequest(event) {
    event.preventDefault();
    if (!currentSelectedDate) return;

    const name = document.getElementById('req-name').value;
    const email = document.getElementById('req-email').value;
    const startTime = document.getElementById('req-start-time').value;
    const endTime = document.getElementById('req-end-time').value;
    const title = document.getElementById('req-title').value;
    const description = document.getElementById('req-description').value;

    try {
      const res = await fetch('/api/request-slot', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          task_date: currentSelectedDate,
          start_time: startTime,
          end_time: endTime,
          title: title,
          description: description,
          requested_by_name: name,
          requested_by_email: email
        })
      });

      const data = await res.json();
      if (res.ok && data.success) {
        showToast('Your booking request has been submitted!', 'success');
        document.getElementById('req-name').value = '';
        document.getElementById('req-email').value = '';
        document.getElementById('req-title').value = '';
        document.getElementById('req-description').value = '';
        openTaskModal(currentSelectedDate);
      } else {
        showToast(data.message || 'Failed to submit request', 'error');
      }
    } catch (err) {
      showToast('Error connecting to server', 'error');
    }
  }

  async function handleCreateTask(event) {
    event.preventDefault();
    if (!currentSelectedDate) return;

    if (!isAdminAuthenticated) {
      openAdminLoginModal();
      showToast('Admin login required to create tasks', 'info');
      return;
    }

    const startTime = document.getElementById('task-start-time').value;
    const endTime = document.getElementById('task-end-time').value;
    const title = document.getElementById('task-title').value;
    const description = document.getElementById('task-description').value;
    const isBooked = document.getElementById('task-is-booked').checked;

    try {
      const res = await fetch('/api/tasks', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          task_date: currentSelectedDate,
          start_time: startTime,
          end_time: endTime,
          title: title,
          description: description,
          is_booked: isBooked
        })
      });

      const data = await res.json();
      if (res.ok && data.success) {
        showToast('Task added successfully!', 'success');
        document.getElementById('task-title').value = '';
        document.getElementById('task-description').value = '';
        openTaskModal(currentSelectedDate);
      } else if (res.status === 401) {
        openAdminLoginModal();
        showToast('Admin session expired. Please verify password.', 'error');
      } else {
        showToast(data.message || 'Failed to create task', 'error');
      }
    } catch (err) {
      showToast('Error connecting to server', 'error');
    }
  }

  async function toggleTaskBooking(taskId) {
    try {
      const res = await fetch(`/api/tasks/${taskId}/toggle`, { method: 'PUT' });
      const data = await res.json();
      if (res.ok && data.success) {
        showToast('Booking status updated', 'success');
        openTaskModal(currentSelectedDate);
      } else {
        showToast(data.message || 'Update failed', 'error');
      }
    } catch (err) {
      showToast('Network error toggling status', 'error');
    }
  }

  async function deleteTask(taskId) {
    if (!confirm('Are you sure you want to delete this task allocation?')) return;

    try {
      const res = await fetch(`/api/tasks/${taskId}`, { method: 'DELETE' });
      const data = await res.json();
      if (res.ok && data.success) {
        showToast('Task deleted', 'info');
        openTaskModal(currentSelectedDate);
      } else {
        showToast(data.message || 'Delete failed', 'error');
      }
    } catch (err) {
      showToast('Network error deleting task', 'error');
    }
  }
</script>
{{ end }}
